<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AI Analyst Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:              #fafafa;
    --surface:         #ffffff;
    --surface-2:       #f4f4f4;
    --border:          #e0e0e0;
    --text-primary:    #1a1a1a;
    --text-secondary:  #4a4a4a;
    --text-tertiary:   #8a8a8a;
    --accent:          #1e4d8c;
    --accent-hover:    #163a6b;
    --accent-light:    #eef2f8;
    --bearish:         #8b1a1a;
    --bearish-bg:      #fbeaea;
    --font-display:    'Playfair Display', Georgia, serif;
    --font-body:       'Source Serif 4', Georgia, serif;
    --font-ui:         'DM Sans', system-ui, sans-serif;
    --radius:          4px;
    --radius-btn:      6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    font-size: 16px;
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Nav */
  .nav {
    padding: 20px 48px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-brand {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-decoration: none;
  }
  .nav-link {
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .nav-link:hover { color: var(--text-primary); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    width: 100%;
    max-width: 440px;
  }

  .card-heading {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .card-subheading {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* Form */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }
  .form-label {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .form-input {
    font-family: var(--font-ui);
    font-size: 15px;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .form-input::placeholder { color: var(--text-tertiary); }

  .btn-primary {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    color: var(--surface);
    background: var(--accent);
    border: none;
    border-radius: var(--radius-btn);
    padding: 13px;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .btn-magic {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid #c5d5e8;
    border-radius: var(--radius-btn);
    padding: 11px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-magic:hover { background: #dde8f5; }

  .form-footer {
    margin-top: 24px;
    text-align: center;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--text-secondary);
  }
  .form-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .form-footer a:hover { text-decoration: underline; }

  .error-box {
    background: var(--bearish-bg);
    border: 1px solid #e8b4b4;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--bearish);
    margin-bottom: 20px;
    display: none;
  }

  .success-box {
    background: #e8f5ee;
    border: 1px solid #a8d5b8;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: var(--font-ui);
    font-size: 13px;
    color: #1a6b3c;
    margin-bottom: 20px;
    display: none;
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">AI Analyst Weekly</a>
  <a class="nav-link" href="signup.html">No account? Start free trial</a>
</nav>

<main class="main">
  <div class="card">
    <h1 class="card-heading">Welcome back.</h1>
    <p class="card-subheading">Sign in to your account to access your weekly research.</p>

    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box"></div>

    <!-- Password sign-in -->
    <form id="signin-form" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn-primary" type="submit" id="signin-btn">Sign in</button>
    </form>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">or</span>
      <span class="divider-line"></span>
    </div>

    <!-- Magic link -->
    <form id="magic-form" onsubmit="handleMagicLink(event)">
      <button class="btn-magic" type="submit" id="magic-btn">Send magic link instead</button>
    </form>

    <p class="form-footer">
      Don't have an account? <a href="signup.html">Start your free trial →</a>
    </p>
  </div>
</main>

<script>
// ─── Supabase client ─────────────────────────────────────────────
// Replace these with your actual values (or load from a config endpoint)
const SUPABASE_URL = window.SUPABASE_URL || 'http://localhost:54321';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'your-anon-key';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── Redirect if already signed in ───────────────────────────────
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'dashboard.html';
});

// ─── UI helpers ───────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success-box').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-box');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('error-box').style.display = 'none';
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  if (btnId === 'signin-btn') btn.textContent = loading ? 'Signing in…' : 'Sign in';
  if (btnId === 'magic-btn') btn.textContent = loading ? 'Sending…' : 'Send magic link instead';
}

// ─── Password sign-in ─────────────────────────────────────────────
async function handleSignIn(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  setLoading('signin-btn', true);
  document.getElementById('error-box').style.display = 'none';

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    showError(error.message);
    setLoading('signin-btn', false);
    return;
  }

  window.location.href = 'dashboard.html';
}

// ─── Magic link ───────────────────────────────────────────────────
async function handleMagicLink(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Enter your email address above, then click Send magic link.');
    return;
  }

  setLoading('magic-btn', true);
  document.getElementById('error-box').style.display = 'none';

  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
  });

  if (error) {
    showError(error.message);
  } else {
    showSuccess(`Magic link sent to ${email}. Check your inbox.`);
  }
  setLoading('magic-btn', false);
}

// ─── Handle magic link callback (hash from Supabase redirect) ────
supabase.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
