<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Conviction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:              #fafafa;
    --surface:         #ffffff;
    --surface-2:       #f4f4f4;
    --border:          #e0e0e0;
    --text-primary:    #1a1a1a;
    --text-secondary:  #4a4a4a;
    --text-tertiary:   #8a8a8a;
    --accent:          #1e4d8c;
    --accent-hover:    #163a6b;
    --accent-light:    #eef2f8;
    --bullish:         #1a6b3c;
    --bullish-bg:      #e8f5ee;
    --bearish:         #8b1a1a;
    --bearish-bg:      #fbeaea;
    --font-display:    'Playfair Display', Georgia, serif;
    --font-body:       'Source Serif 4', Georgia, serif;
    --font-ui:         'DM Sans', system-ui, sans-serif;
    --radius:          4px;
    --radius-btn:      6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    font-size: 16px;
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Nav */
  .nav {
    padding: 20px 48px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-brand {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-decoration: none;
  }
  .nav-link {
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .nav-link:hover { color: var(--text-primary); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    width: 100%;
    max-width: 440px;
  }

  .card-heading {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .card-subheading {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* Form */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }
  .form-label {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .form-input {
    font-family: var(--font-ui);
    font-size: 15px;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .form-input::placeholder { color: var(--text-tertiary); }

  .btn-primary {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    color: var(--surface);
    background: var(--accent);
    border: none;
    border-radius: var(--radius-btn);
    padding: 13px;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-footer {
    margin-top: 24px;
    text-align: center;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--text-secondary);
  }
  .form-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .form-footer a:hover { text-decoration: underline; }

  .error-box {
    background: var(--bearish-bg);
    border: 1px solid #e8b4b4;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--bearish);
    margin-bottom: 20px;
    display: none;
  }

  .success-box {
    background: var(--bullish-bg);
    border: 1px solid #a8d5b8;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--bullish);
    margin-bottom: 20px;
    display: none;
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">Conviction</a>
  <a class="nav-link" href="signin.html">Back to sign in</a>
</nav>

<main class="main">
  <div class="card">

    <!-- ── Request state: email entry ───────────────────────────── -->
    <div id="request-state">
      <h1 class="card-heading">Reset your password.</h1>
      <p class="card-subheading">Enter your email address and we'll send you a link to set a new password.</p>

      <div class="error-box" id="req-error"></div>
      <div class="success-box" id="req-success"></div>

      <form id="request-form" onsubmit="handleRequestReset(event)">
        <div class="form-group">
          <label class="form-label" for="reset-email">Email address</label>
          <input class="form-input" id="reset-email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button class="btn-primary" type="submit" id="req-btn">Send reset link</button>
      </form>

      <p class="form-footer">
        ← <a href="signin.html">Back to sign in</a>
      </p>
    </div>

    <!-- ── Recovery state: new password form ────────────────────── -->
    <div id="recovery-state" style="display:none">
      <h1 class="card-heading">Set a new password.</h1>
      <p class="card-subheading">Choose a strong password for your account.</p>

      <div class="error-box" id="rec-error"></div>
      <div class="success-box" id="rec-success"></div>

      <form id="recovery-form" onsubmit="handleSetPassword(event)">
        <div class="form-group">
          <label class="form-label" for="rec-password">New password</label>
          <input class="form-input" id="rec-password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="rec-confirm">Confirm new password</label>
          <input class="form-input" id="rec-confirm" type="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn-primary" type="submit" id="rec-btn">Set new password</button>
      </form>

      <p class="form-footer">
        ← <a href="signin.html">Back to sign in</a>
      </p>
    </div>

  </div>
</main>

<script>
// ─── Supabase ─────────────────────────────────────────────────────
const SUPABASE_URL = window.SUPABASE_URL || 'http://localhost:54321';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'your-anon-key';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── Detect recovery state from URL hash ─────────────────────────
// Supabase appends #access_token=... to the redirect URL after a reset link click.
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const isRecovery = hashParams.has('access_token') &&
                   (hashParams.get('type') === 'recovery' || hashParams.has('type'));

if (isRecovery) {
  showRecoveryState();
}

// Also listen for the PASSWORD_RECOVERY auth event (Supabase SDK parses the hash too)
supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    showRecoveryState();
  }
  if (event === 'SIGNED_IN' && !isRecovery) {
    // Normal sign-in (not from a recovery link) — redirect to dashboard
    window.location.href = 'dashboard.html';
  }
});

function showRecoveryState() {
  document.getElementById('request-state').style.display = 'none';
  document.getElementById('recovery-state').style.display = 'block';
}

// ─── Request password reset ───────────────────────────────────────
async function handleRequestReset(e) {
  e.preventDefault();
  hideMsg('req-error');
  hideMsg('req-success');

  const email = document.getElementById('reset-email').value.trim();
  const btn = document.getElementById('req-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const redirectTo = window.location.origin + '/settings';
  const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    showMsg('req-error', error.message);
  } else {
    showMsg('req-success', "Check your inbox — we've sent a password reset link.");
    document.getElementById('request-form').reset();
  }

  btn.disabled = false;
  btn.textContent = 'Send reset link';
}

// ─── Set new password (recovery state) ───────────────────────────
async function handleSetPassword(e) {
  e.preventDefault();
  hideMsg('rec-error');
  hideMsg('rec-success');

  const newPw   = document.getElementById('rec-password').value;
  const confirm = document.getElementById('rec-confirm').value;

  if (newPw !== confirm) {
    showMsg('rec-error', 'Passwords do not match.');
    return;
  }

  const btn = document.getElementById('rec-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await supabase.auth.updateUser({ password: newPw });

  if (error) {
    showMsg('rec-error', error.message);
    btn.disabled = false;
    btn.textContent = 'Set new password';
  } else {
    showMsg('rec-success', 'Password updated. Redirecting to your dashboard…');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
  }
}

// ─── UI helpers ───────────────────────────────────────────────────
function showMsg(id, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.style.display = 'block';
}
function hideMsg(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}
</script>
</body>
</html>
