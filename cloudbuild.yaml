steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/ai-analyst-weekly:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/ai-analyst-weekly:latest
      - .

  # Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, '--all-tags', 'gcr.io/$PROJECT_ID/ai-analyst-weekly']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ai-analyst-weekly
      - --image=gcr.io/$PROJECT_ID/ai-analyst-weekly:$COMMIT_SHA
      - --region=us-east1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --timeout=600          # 10 min — covers the longest analysis run
      - --set-env-vars=ENVIRONMENT=production

images:
  - gcr.io/$PROJECT_ID/ai-analyst-weekly:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/ai-analyst-weekly:latest

options:
  logging: CLOUD_LOGGING_ONLY
